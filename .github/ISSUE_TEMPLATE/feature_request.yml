name: 功能建议 / Feature request
description: 提议一个新功能或改进 / Propose a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        中英文皆可 / Either language is fine.

        提之前可以先看一眼 [README 的一期范围](../blob/main/README.zh-CN.md#一期范围)——
        有些功能是**有意不做**的，理由记在
        [docs/architecture.md](../blob/main/docs/architecture.md) 里。
        如果你想推翻其中某个决定，直接说，那份文档留下理由正是为了这个。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem does this solve
      description: |
        请从实际场景说起，而不是直接给方案。「我想要 X 功能」很难判断，
        「我在做 Y 的时候卡在 Z」则能讨论出可能比 X 更好的解法。

        Start from the situation, not the solution. "I want feature X" is hard to evaluate;
        "when doing Y I get stuck at Z" often leads to something better than X.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法 / What you have in mind
      description: 可选。如果已经有想法就写下来 / Optional

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过 / How you work around it today
      description: |
        比如「切到终端里跑 git 命令」。这能说明问题的实际严重程度。
        e.g. "I switch to a terminal and run git by hand" — this tells us how much it hurts.

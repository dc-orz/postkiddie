name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 里没人看增量编译缓存，关掉能省磁盘和一部分时间
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint 与格式检查
        run: pnpm exec biome ci .

      - name: 类型检查
        run: pnpm run typecheck

      - name: Design token 对比度检查
        run: pnpm run check:contrast

      - name: 单元测试
        run: pnpm run test

  rust:
    name: Rust 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri 在 Linux 上的系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      # 上一步会顺带重新生成 TypeScript 绑定。若结果与仓库里的不同，
      # 说明有人改了 Rust 模型却没提交重新生成的 bindings——
      # 前端会继续按旧类型编译通过，然后在运行时拿到对不上的数据。
      # 这正是引入 specta 要根除的那类静默故障，所以必须让 CI 红。
      - name: 检查 TypeScript 绑定是否最新
        run: |
          if ! git diff --exit-code src/types/bindings.ts; then
            echo "::error::bindings.ts 已过期。请在本地跑 pnpm rs:test 并提交重新生成的文件。"
            exit 1
          fi

  # 这是个跨端应用，但只在一个平台上跑检查等于没验证跨端。
  # 这个 job 专门盯三类只会在特定平台暴露的问题：
  #   - 路径分隔符（Windows 的 `\` vs 我们统一用的 `/`）
  #   - git CLI 在各平台的输出差异与可执行文件定位
  #   - Tauri 自身的平台条件编译
  # fail-fast: false —— 一次看全所有平台的问题，而不是修一个再发现下一个。
  cross-platform:
    name: 跨平台编译与测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! 会在编译期校验 frontendDist 存在，
      # 所以必须先产出 dist，否则 cargo check 直接失败
      - name: 构建前端产物
        run: pnpm run build

      - name: 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # 在各平台真跑一遍：路径处理与 git 集成的问题只有这样才看得见
      - name: 单元与集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
        env:
          # git 集成测试要建提交，CI 的 runner 没有全局身份配置
          GIT_AUTHOR_NAME: PostKiddie CI
          GIT_AUTHOR_EMAIL: ci@postkiddie.dev
          GIT_COMMITTER_NAME: PostKiddie CI
          GIT_COMMITTER_EMAIL: ci@postkiddie.dev

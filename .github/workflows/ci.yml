name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 里没人看增量编译缓存，关掉能省磁盘和一部分时间
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint 与格式检查
        run: pnpm exec biome ci .

      - name: 类型检查
        run: pnpm run typecheck

      - name: Design token 对比度检查
        run: pnpm run check:contrast

      - name: 单元测试
        run: pnpm run test

  rust:
    name: Rust 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri 在 Linux 上的系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 这一步不是可选的：`tauri::generate_context!` 在**编译期**就校验
      # tauri.conf.json 里的 frontendDist（`../dist`）存在，所以 Rust 侧的任何编译
      # ——包括 clippy 和 cargo test——都得先有前端产物，否则直接
      # 「proc macro panicked: this path doesn't exist」。
      - name: 构建前端产物
        run: pnpm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      # 上一步会顺带重新生成 TypeScript 绑定。若结果与仓库里的不同，
      # 说明有人改了 Rust 模型却没提交重新生成的 bindings——
      # 前端会继续按旧类型编译通过，然后在运行时拿到对不上的数据。
      # 这正是引入 specta 要根除的那类静默故障，所以必须让 CI 红。
      - name: 检查 TypeScript 绑定是否最新
        run: |
          if ! git diff --exit-code src/types/bindings.ts; then
            echo "::error::bindings.ts 已过期。请在本地跑 pnpm rs:test 并提交重新生成的文件。"
            exit 1
          fi

  # 这是个跨端应用，但只在一个平台上跑检查等于没验证跨端。
  # 这个 job 专门盯几类只会在特定平台暴露的问题：
  #   - 路径分隔符（Windows 的 `\` vs 我们统一用的 `/`）
  #   - git CLI 在各平台的输出差异与可执行文件定位
  #   - PTY：Unix 的 openpty 与 Windows 的 ConPTY 是两套实现，shell 也不是同一个
  #   - Tauri 自身的平台条件编译
  #
  # 矩阵里没有 ubuntu：上面的 `rust` job 已经在 Linux 上跑完了 clippy 与全部测试，
  # 再加一遍等于白等一次完整编译（clippy 本身就包含 cargo check）。
  # fail-fast: false —— 一次看全所有平台的问题，而不是修一个再发现下一个。
  cross-platform:
    name: 跨平台编译与测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! 会在编译期校验 frontendDist 存在，
      # 所以必须先产出 dist，否则 cargo check 直接失败
      - name: 构建前端产物
        run: pnpm run build

      - name: 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # 在各平台真跑一遍：路径处理、PTY 与 git 集成的问题只有这样才看得见。
      #
      # 这里**不要**设 GIT_AUTHOR_* / GIT_COMMITTER_*。看着像是给没有全局 git 配置的
      # runner 兜底，实际上是有害的：`tests/git_cli.rs` 的 `temp_repo()` 已经用
      # `git config` 写好了仓库级身份，而环境变量的优先级高于配置文件——于是那些
      # 断言 author 的测试会拿到 CI 的名字而挂掉，而且只在 CI 上挂。
      - name: 单元与集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
